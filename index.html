<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laberinto</title>

    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #222;
            color: #eee;
        }

        canvas {
            background: #fff;
            margin-top: 20px;
            border: 3px solid #444; 
            border-radius: 8px; 
        }

        #mensaje {
                margin-top: 10px;
                font-size: 1.5em;
                min-height: 1.5em;
                font-weight: bold;
                text-align: center;
        }
        h1 {
            margin-bottom: 10px;
        }

        button {
            padding: 8px 14px;
            font-size: 1em;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            }
        /* Contenedor que permite colocar el GIF encima del canvas */
        #contenedorMaze {
            position: relative;
        }

        /* GIF de victoria */
        #gifVictoria {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        #controlesMovil {
            display: none;
            margin-top: 15px;
            text-align: center;
        }

        #controlesMovil button {
            width: 55px;
            height: 55px;
            margin: 3px;
            font-size: 1.4em;
            padding: 0;
            touch-action: manipulation;
            user-select: none;
        }

        @keyframes aparecerVictoria {
            0% {
              transform: translate(-50%, -50%) scale(0);
            }

            70% {
              transform: translate(-50%, -50%) scale(1.15);
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
            }
        }
        @media screen and (max-width: 700px) {
            #controlesMovil {
                display: block !important;
            }
        }
    </style>
</head>

<body>
    <h1>Laberinto</h1>

    <div>
        <label>Tamaño: </label>
        <input type="number" id="tamano" value="10" min="3" max="40">
        <button id="btnNuevo">Nuevo laberinto</button>
    </div>

    <div id="mensaje"></div>

    <div id="controlesMovil">
        <button id="btnArriba">▲</button>

        <div>
            <button id="btnIzquierda">◀</button>
            <button id="btnAbajo">▼</button>
            <button id="btnDerecha">▶</button>
        </div>
    </div>

    <div id="contenedorMaze">
        <canvas id="canvas" width="600" height="600"></canvas>

        <img
            id="gifVictoria"
            src="Champions League Football GIF by FC Barcelona.gif"
            alt="Celebración"
        >
    </div>

    <script src="wasm/maze.js"></script>
    <script src="game.js"></script>
</body>
</html>
